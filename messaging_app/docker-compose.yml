version: "3.9"

services:
  web:
    build: .
    container_name: messaging_web
    command: python3 manage.py runserver
    volumes:
      - .:/messaging_project
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Django will use these to connect to MySQL
      MYSQL_DB: messaging_db
      MYSQL_USER: chika
      MYSQL_PASSWORD: secret123
      MYSQL_HOST: db
      MYSQL_PORT: 3306

  db:
    image: mysql:8
    container_name: messaging_db
    restart: always
    environment:
      MYSQL_DATABASE: messaging_db
      MYSQL_USER: chika
      MYSQL_PASSWORD: secret123
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
